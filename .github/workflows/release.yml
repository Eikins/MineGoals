# Builds both loaders and publishes a GitHub release when a version tag is pushed.
#   git tag v0.2.0 && git push origin v0.2.0         -> release "MineGoals 0.2.0"
#   git tag v0.2.0-beta.1 && git push origin v0.2.0-beta.1  -> marked as a pre-release (the tag contains "-")
# The tag (without its leading "v") becomes the mod version in the jars and their file names, whatever
# gradle.properties says.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build -Pversion=${{ steps.version.outputs.version }}

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: MineGoals ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            fabric/build/libs/minegoals-fabric-*-${{ steps.version.outputs.version }}.jar
            neoforge/build/libs/minegoals-neoforge-*-${{ steps.version.outputs.version }}.jar
